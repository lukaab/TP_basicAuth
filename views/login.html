<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Batcave</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #222;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      border: 1px solid #444;
    }

    h1 {
      color: #f5c542;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 20px;
      background-color: #f5c542;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    a {
      color: #f5c542;
    }

    p {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Connexion Batcave</h1>

    <form action="/auth/login" method="POST">
      <label for="username">Nom d'utilisateur</label>
      <input type="text" id="username" name="username" required>

      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required>

      <button type="submit">Se connecter</button>
    </form>

    <p>
      Pas encore inscrit ?
      <a href="/register.html">Créer un compte</a>
    </p>
  </div>
</body>
</html>
