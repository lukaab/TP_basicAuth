<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion Batcave</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #222;
      padding: 30px;
      border-radius: 10px;
      width: 420px;
      border: 1px solid #444;
    }

    h1 {
      color: #f5c542;
      text-align: center;
    }

    p {
      text-align: center;
      line-height: 1.5;
    }

    .oauth-button {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 14px;
      margin-top: 15px;
      border-radius: 6px;
      font-weight: bold;
      color: white;
    }

    .google {
      background-color: #4285f4;
    }

    .github {
      background-color: #333;
    }

    .facebook {
      background-color: #1877f2;
    }

    .note {
      color: #ccc;
      font-size: 14px;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Connexion Batcave</h1>

    <p>
      Choisis un fournisseur d'identité pour entrer dans la Batcave.
    </p>

    <a class="oauth-button google" href="/auth/google">
      Se connecter avec Google
    </a>

    <a class="oauth-button github" href="/auth/github">
      Se connecter avec GitHub
    </a>

    <a class="oauth-button facebook" href="/auth/facebook">
      Se connecter avec Facebook
    </a>

    <p class="note">
      Dans ce TP, l'application ne gère plus directement les mots de passe locaux.
      L'authentification est déléguée à un fournisseur externe.
    </p>
  </div>
</body>
</html>
