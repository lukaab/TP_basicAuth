<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bat-Ordinateur</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      padding: 30px;
    }

    h1 {
      color: #f5c542;
    }

    a {
      color: #f5c542;
    }

    .grid {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .card {
      background-color: #222;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 20px;
      width: 220px;
    }

    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      box-sizing: border-box;
      height: 100px;
    }

    button {
      margin-top: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }

    .section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #444;
    }
  </style>
</head>
<body>
  <h1>Bat-Ordinateur</h1>

  <p>
    Bienvenue, Justicier <span id="username">...</span>
  </p>

  <p>
    Connexion via : <span id="provider">...</span>
  </p>

  <p>
    <a href="/auth/logout">Se déconnecter</a>
  </p>

  <div class="section">
    <h2>Gadgets secrets</h2>
    <button id="reloadSecrets">Recharger les gadgets</button>
    <div id="secrets" class="grid"></div>
  </div>

  <div class="section">
    <h2>Rapport de mission</h2>
    <textarea id="reportContent" placeholder="Écris ton rapport ici..."></textarea>
    <br>
    <button id="sendReport">Envoyer le rapport</button>
    <p id="reportMessage"></p>
  </div>

  <script src="/dashboard.js"></script>
</body>
</html>
