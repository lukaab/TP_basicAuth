<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Erreur OAuth</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background-color: #222;
      padding: 30px;
      border-radius: 10px;
      width: 450px;
      border: 1px solid #444;
      text-align: center;
    }

    h1 {
      color: #f5c542;
    }

    a {
      color: #f5c542;
    }

    .message {
      background-color: #111;
      padding: 15px;
      border: 1px solid #444;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Erreur OAuth</h1>

    <p class="message">{{message}}</p>

    <a href="/auth/login">Retour à la connexion</a>
  </div>
</body>
</html>
